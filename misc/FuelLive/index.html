<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Cost Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 id="title">Fuel Cost Tracker</h1>

    <div id="verticalView">
        <div class="input-section">
            <label>Fuel Price (€/L)</label>
            <input id="fuelPrice" type="number" step="0.01" placeholder="1.75">

            <label>Consumption (L/100km)</label>
            <input id="consumption" type="number" step="0.1" placeholder="6.5">
        </div>

        <div class="stats">
            <div class="stat">
                <span class="label">Distance</span>
                <span id="distance">0.00 km</span>
            </div>

            <div class="stat">
                <span class="label">Fuel Used</span>
                <span id="fuelUsed">0.00 L</span>
            </div>

            <div class="stat big">
                <span class="label">Cost</span>
                <span id="cost">€0.00</span>
            </div>
        </div>

        <button id="startStopBtn">Start Trip</button>
    </div>

    <!-- HORIZONTAL HUD -->
    <div id="horizontalHUD">
        <div id="hudCost">€0.00</div>
        <div id="hudSmall">
            <span id="hudFuel">0.00 L</span> • 
            <span id="hudDistance">0.00 km</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
