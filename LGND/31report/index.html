<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>10-31 Report Generator</title>
    <link rel="shortcut icon" href="carjacking.png" />
    <link rel="stylesheet" href="index.css" />
    <link href='https://fonts.googleapis.com/css?family=Nunito' rel='stylesheet'>
    <link rel="stylesheet" href="../style/font-awesome-4.7.0/css/font-awesome.min.css">
</head>

<body>
<header>
    <br />
    <div class="headerbuttons"><a href="https://exsertrook.github.io/LGND" class="button">Back to HUB</a></div>
    <br />
    10-31 Report Generator W.I.P<br />
    <br />
    <label class="inline" style="font-size: 14px;">Your Callsign & Name:</label><br />
    <input type="text" id="yourself" name="yourself" placeholder="[X-101] Thomas Sucher"/><br />
    <div class="popup" id="copyReport">
        <div class="btn" title="Copy the generated report to your clipboard">Copy The Report</div>
        <span class="popuptext" id="myPopup">Report copied!</span>
    </div>
</header>

<body>
    <div id="form">
        <div class="form-group">
            <label>Information:</label>

            10-31 Call Location:
            <input type="text" id="location" name="location" placeholder="Hawick Ave"><br />

            Was there a suspect on scene?
            <select id="suspectonscene">
                <option>No</option>
                <option>Yes</option>
            </select><br />

            <!-- Appears only if suspect = YES -->
            <div id="fleeWrapper" style="display:none;">
                Did they attempt to flee?
                <select id="fleeattempt">
                    <option>No</option>
                    <option>Yes</option>
                </select><br />
            </div>

            <!-- Appears only if flee = YES -->
            <div id="gotAwayWrapper" style="display:none;">
                Did the suspect get away?
                <select id="gotaway">
                    <option>No</option>
                    <option>Yes</option>
                </select><br />
            </div>

            <!-- Weapon moved down here -->
            <div id="weaponWrapper" style="display:none;">
                What weapon?
                <input type="text" id="weapon" name="weapon" placeholder="Hunting Rifle"><br />
            </div>
        </div>

        <div class="form-group">
            <label>Vehicle Information:</label>
            Description: <input type="text" id="vehicledesc" name="vehicledesc" placeholder="Sultan Classic"><br />
            Color: <input type="text" class="text2" id="carcolor" name="carcolor" placeholder="Blue"><br />
            Plate: <input type="text" class="text2" id="vehicleplate" name="vehicleplate" placeholder="12ABC345"><br />
            Registration: <input type="text" id="vehiclereg" name="vehiclereg" placeholder="FirstName LastName">
        </div>

        <div class="form-group">
            <label>Medical Attention...</label>
            
            <label>
                <input type="checkbox" id="medneed" name="medneed" value="medneed"><span></span> - Was needed? <br /><br />
            </label>            
            
            Received Medical: &nbsp Suspects: 
            <select id="medneedsus">
                <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option>
            </select> 
            &nbsp Police: 
            <select id="medneedpd">
                <option selected>0</option><option>1</option><option>2</option><option>3</option><option>4</option>
                <option>5</option><option>6</option><option>7</option><option>8</option><option>9</option>
                <option>10</option><option>11</option><option>12</option>
            </select><br />

            Which hospital?
            <select id="hospitalname">
                <option selected>Mount Zonah</option>
                <option>Sandy Shores Medical</option>
                <option>Paleto Hospital</option>
                <option>Cayo Perico</option>
            </select>
            <br />

            <label>
                <input type="checkbox" id="runhospital" name="runhospital" value="runhospital"><span></span> - Attempted to flee at hospital?
            </label>        
        </div>

        <div class="form-group">
            <label>Processed at...</label>
            <select id="processedat">
                <option>MRPD</option>
                <option selected>Rockford Hills Police Department</option>
                <option>Sandy Shores Sheriff's Office</option>
                <option>Davis Police Department</option>
                <option>Paleto Police Department</option>
                <option>Highway Police Department</option>
                <option>Del Perro Pier PD</option>
                <option>Cayo Perico</option>
            </select>
        </div>
    </div>

    <textarea class="wide" id="reportBody">
The Report will automatically generate as you fill out the form to the left.

(Note: the generated report will be editable, but once you edit it, you can no longer update it based on the form)

If you have any questions or concerns, feel free to fill the feedback form on the main website :)

Also if you want to show love, make sure to thank Sucher :)
    </textarea>

    <script src="reports.js"></script>
</body>
</html>
